name: Build TIA PLAYER APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compiler l'APK
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          code=$?
          echo "=== ERREURS DE COMPILATION ==="
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -80
          echo "=== FIN DES ERREURS (code $code) ==="
          exit $code
      - name: Garder le journal complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-build
          path: build.log
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: TIA-PLAYER-apk
          path: app/build/outputs/apk/debug/*.apk
